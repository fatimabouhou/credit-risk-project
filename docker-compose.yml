services:
  # -------------------------------------------------------------
  # 1. BASE DE DONNÉES MONGODB & INTERFACE
  # -------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: credit_risk_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - credit_risk_network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 2. DOCUMENT SERVICE (Port 8000)
  # -------------------------------------------------------------
  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: document_service
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      # NOUVEAU : On indique comment joindre le service financier dans le réseau Docker
      - FINANCIAL_SERVICE_URL=http://financial-service:8001
    volumes:
      - ./document-service/simulators/data:/app/simulators/data
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 3. FINANCIAL SERVICE (Port 8001) - 🔥 LE NOUVEAU SERVICE 🔥
  # -------------------------------------------------------------
  financial-service:
    build:
      context: ./financial-service
      dockerfile: Dockerfile
    container_name: financial_service
    restart: on-failure
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 4. CHROMA (Port 8010) - Vector store pour le RAG de agentic-service
  # -------------------------------------------------------------
  chroma:
    image: chromadb/chroma:latest
    container_name: credit_risk_chroma
    restart: on-failure
    ports:
      - "8010:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 5. POSTGRES (Port 5432) - Persistance de l'état de l'agent
  # (checkpointing LangGraph, agentic-service) - pas de données métier ici
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: credit_risk_postgres
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 6. AGENTIC SERVICE (Port 8002) - Financial Analysis Agent (RAG + LLM)
  # -------------------------------------------------------------
  agentic-service:
    build:
      context: ./agentic-service
      dockerfile: Dockerfile
    container_name: agentic_service
    restart: on-failure
    ports:
      - "8002:8000"
    depends_on:
      - chroma
      - postgres
      - financial-service
      - document-service
    # Les clés/modèles LLM sont lus depuis agentic-service/.env, pas depuis le
    # .env racine : le Dockerfile ne copie que app/ (donc aucun .env n'existe
    # dans l'image) et load_dotenv() ne trouvait rien à l'exécution. Sans
    # env_file, deux conséquences réelles constatées :
    #   - les clés GROQ éditées dans agentic-service/.env n'atteignaient jamais
    #     le conteneur, qui repartait toujours sur ${GROQ_API_KEY} du .env racine ;
    #   - OPENROUTER_API_KEY n'était passé nulle part, donc decision.py levait
    #     KeyError et l'agent 2 renvoyait systématiquement "decision": null
    #     (voir le try/except de api/routes.py) — la décision de crédit n'a
    #     jamais pu aboutir sous Docker.
    env_file:
      - ./agentic-service/.env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - POSTGRES_CHECKPOINT_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FINANCIAL_SERVICE_URL=http://financial-service:8001
      - DOCUMENT_SERVICE_URL=http://document-service:8000
    # Le modèle d'embedding du RAG (BAAI/bge-m3, ~2 Go, voir tools/rag_tool.py)
    # est téléchargé au premier usage dans le cache HuggingFace du conteneur.
    # Sans ce volume, chaque recréation du conteneur repartait d'un cache vide :
    # la première analyse restait bloquée plusieurs minutes sur le
    # re-téléchargement avant de pouvoir répondre.
    volumes:
      - hf_cache:/root/.cache/huggingface
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 7. FRONTEND (Port 5173) - Dashboard React/Vite
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: credit_risk_frontend
    restart: on-failure
    ports:
      - "5173:5173"
    depends_on:
      - document-service
      - financial-service
      - agentic-service
      - report-service
    environment:
      - VITE_FINANCIAL_API_URL=http://financial-service:8001/api/v1/financial
      - VITE_AGENTIC_API_URL=http://agentic-service:8000/api/v1/agentic
      - VITE_DOCUMENT_API_URL=http://document-service:8000
      - VITE_REPORT_API_URL=http://report-service:8000/api/v1/report
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 8. REPORT SERVICE (Port 8003) - Génération du rapport de crédit
  # final (PDF) : assemble extraction (document-service) + analyse et
  # décision (agentic-service), aucun appel LLM propre à ce service.
  # -------------------------------------------------------------
  report-service:
    build:
      context: ./report-service
      dockerfile: Dockerfile
    container_name: report_service
    restart: on-failure
    ports:
      - "8003:8000"
    depends_on:
      - document-service
      - agentic-service
    environment:
      - DOCUMENT_SERVICE_URL=http://document-service:8000
      - AGENTIC_SERVICE_URL=http://agentic-service:8000
    networks:
      - credit_risk_network

# ==========================================
# DÉCLARATION DES RESSOURCES GLOBALES
# ==========================================
networks:
  credit_risk_network:
    driver: bridge

volumes:
  mongo_data:
  chroma_data:
  postgres_data:
  # Cache du modèle d'embedding BAAI/bge-m3 (agentic-service) — évite un
  # re-téléchargement de ~2 Go à chaque recréation du conteneur.
  hf_cache: