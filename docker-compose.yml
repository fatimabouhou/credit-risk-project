version: '3.8'

services:
  # -------------------------------------------------------------
  # 1. BASE DE DONNÉES MONGODB
  # -------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: credit_risk_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      # Docker Compose va lire ces valeurs dans le .env
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 2. DOCUMENT SERVICE
  # -------------------------------------------------------------
  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: document_service
    restart: on-failure
    depends_on:
      - mongodb
    environment:
      # Le service va aussi lire ces valeurs dans le .env
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
    volumes:
      - ./document-service/simulators/data:/app/simulators/data
    networks:
      - credit_risk_network