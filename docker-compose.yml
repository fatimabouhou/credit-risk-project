services:
  # -------------------------------------------------------------
  # 1. BASE DE DONNÉES MONGODB & INTERFACE
  # -------------------------------------------------------------
  mongodb:
    image: mongo:latest
    container_name: credit_risk_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    networks:
      - credit_risk_network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: always
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/
      ME_CONFIG_BASICAUTH: false
    depends_on:
      - mongodb
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 2. DOCUMENT SERVICE (Port 8000)
  # -------------------------------------------------------------
  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: document_service
    restart: on-failure
    ports:
      - "8000:8000"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      # NOUVEAU : On indique comment joindre le service financier dans le réseau Docker
      - FINANCIAL_SERVICE_URL=http://financial-service:8001
    volumes:
      - ./document-service/simulators/data:/app/simulators/data
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 3. FINANCIAL SERVICE (Port 8001) - 🔥 LE NOUVEAU SERVICE 🔥
  # -------------------------------------------------------------
  financial-service:
    build:
      context: ./financial-service
      dockerfile: Dockerfile
    container_name: financial_service
    restart: on-failure
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    environment:
      - MONGO_URI=${MONGO_URI}
      - MONGO_DB_NAME=${MONGO_DB_NAME}
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 4. CHROMA (Port 8010) - Vector store pour le RAG de agentic-service
  # -------------------------------------------------------------
  chroma:
    image: chromadb/chroma:latest
    container_name: credit_risk_chroma
    restart: on-failure
    ports:
      - "8010:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 5. POSTGRES (Port 5432) - Persistance de l'état de l'agent
  # (checkpointing LangGraph, agentic-service) - pas de données métier ici
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: credit_risk_postgres
    restart: on-failure
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - credit_risk_network

  # -------------------------------------------------------------
  # 6. AGENTIC SERVICE (Port 8002) - Financial Analysis Agent (RAG + LLM)
  # -------------------------------------------------------------
  agentic-service:
    build:
      context: ./agentic-service
      dockerfile: Dockerfile
    container_name: agentic_service
    restart: on-failure
    ports:
      - "8002:8000"
    depends_on:
      - chroma
      - postgres
      - financial-service
      - document-service
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - POSTGRES_CHECKPOINT_URI=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - FINANCIAL_SERVICE_URL=http://financial-service:8001
      - DOCUMENT_SERVICE_URL=http://document-service:8000
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT}
    networks:
      - credit_risk_network

# ==========================================
# DÉCLARATION DES RESSOURCES GLOBALES
# ==========================================
networks:
  credit_risk_network:
    driver: bridge

volumes:
  mongo_data:
  chroma_data:
  postgres_data: