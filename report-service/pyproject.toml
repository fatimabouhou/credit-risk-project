[project]
name = "report-service"
version = "0.1.0"
description = "Génération du rapport de crédit final (PDF) à partir de l'extraction, l'analyse et la décision déjà produites par document-service et agentic-service"
authors = [
    {name = "fatima bouhou",email = "fatima.bouhou@uit.ac.ma"}
]
requires-python = ">=3.12,<4"
dependencies = [
    "fastapi (>=0.111.0,<0.112.0)",
    "uvicorn[standard] (>=0.30.0,<0.31.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "jinja2 (>=3.1.4,<4.0.0)",
    "weasyprint (>=62.3,<63.0)",
    # pydyf 0.11 a déplacé Stream.transform : weasyprint 62.x appelle encore
    # l ancienne API et lève « super object has no attribute transform » à la
    # génération du PDF. Rien ne bornait pydyf, pip résolvait donc la dernière
    # version publiée et cassait la seule fonction du service.
    "pydyf (>=0.10.0,<0.11.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
