[project]
name = "financial-service"
version = "0.1.0"
description = ""
authors = [
    {name = "fatima bouhou",email = "fatimabouhou51@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.140.2,<0.141.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "pymongo (>=4.17.0,<5.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.3.3,<9.0.0)",
]

# Les tests importent app.engine.* : la racine du service doit être sur le
# sys.path, app/ étant un package implicite (pas de __init__.py).
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
